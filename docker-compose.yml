services:
  app:
    build: .
    image: flowdraft:latest
    container_name: flowdraft
    ports:
      - "8000:8000"
    # API keys: prefer env vars from your local .env (see .env.example). Optional —
    # if absent, keys are read from the mounted models/secretapi.txt + roboflow_key.txt.
    env_file:
      - path: .env
        required: false
    environment:
      # Compliance checker has no Postgres here → it auto-falls back to file SQLite.
      # Uncomment + enable the `postgres` profile below to use Postgres instead.
      # DATABASE_URL: postgresql+psycopg2://dc_user:dc_password@postgres:5432/dc_compliance
      ROBOFLOW_FIXTURE_MODEL: ${ROBOFLOW_FIXTURE_MODEL:-floor-plans-500-r7jy4/1}
    volumes:
      # Mount your local key files (gitignored) read-only so the app can read
      # models/secretapi.txt + models/roboflow_key.txt without baking them in.
      - ./models:/app/models:ro
      # Persist parsed graphs / overlays produced at runtime.
      - ./data:/app/data
    restart: unless-stopped

  # ── Optional: PostgreSQL for the compliance checker ──
  # Enable with:  docker compose --profile postgres up --build
  # and set DATABASE_URL on the app service (see environment block above).
  postgres:
    image: postgres:16-alpine
    container_name: flowdraft-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: dc_user
      POSTGRES_PASSWORD: dc_password
      POSTGRES_DB: dc_compliance
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Optional: Ollama for local embeddings (rule de-duplication) ──
  # Enable with:  docker compose --profile ollama up --build
  ollama:
    image: ollama/ollama:latest
    container_name: flowdraft-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
